<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title">
  <title id="title">WebAssembly runtime interface illustration</title>
  <rect width="800" height="500" fill="#0b0f16"/>
  <rect x="68" y="70" width="664" height="360" rx="18" fill="#151e2b" stroke="#455770"/>
  <rect x="69" y="71" width="145" height="358" rx="18" fill="#101722"/>
  <path d="M214 71V429" stroke="#303e52"/>
  <text x="94" y="111" fill="#a78bfa" font-family="monospace" font-size="19" font-weight="bold">WASM</text>
  <text x="93" y="170" fill="#a9b9ce" font-family="monospace" font-size="13">● runtime</text>
  <text x="93" y="207" fill="#58a6ff" font-family="monospace" font-size="13">› models</text>
  <text x="93" y="244" fill="#a9b9ce" font-family="monospace" font-size="13">  streams</text>
  <text x="93" y="281" fill="#a9b9ce" font-family="monospace" font-size="13">  output</text>
  <text x="246" y="120" fill="#edf3fa" font-family="monospace" font-size="16">tamil-whisper-wasm</text>
  <rect x="246" y="150" width="450" height="228" rx="10" fill="#0b0f16"/>
  <text x="270" y="195" fill="#a78bfa" font-family="monospace" font-size="16">fn</text><text x="300" y="195" fill="#edf3fa" font-family="monospace" font-size="16">transcribe(audio: Stream) {</text>
  <text x="294" y="232" fill="#a9b9ce" font-family="monospace" font-size="15">let model = Model::load_local();</text>
  <text x="294" y="269" fill="#a9b9ce" font-family="monospace" font-size="15">let text = model.infer(audio);</text>
  <text x="294" y="306" fill="#3fc995" font-family="monospace" font-size="15">return text; // no server</text>
  <text x="270" y="343" fill="#edf3fa" font-family="monospace" font-size="16">}</text>
</svg>
