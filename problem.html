<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Problem · BuildSocial</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="detail.css"></head><body><header class="site-header shell"><a class="brand" href="index.html"><span class="brand-mark">+</span>BuildSocial</a><nav class="nav-links" aria-label="Main navigation"><a href="explore.html#problems">Open problems</a><a href="explore.html#projects">Projects</a><a href="index.html#how-it-works">How it works</a></nav><a class="button button-small button-outline" href="index.html#waitlist">Join the beta ↗</a></header><main id="problem-detail" class="shell detail-main"></main><footer class="site-footer shell"><div class="footer-bottom"><span>© 2026 BuildSocial</span><span>Fixture prototype · no data collected</span></div></footer><script src="app.js"></script><script>const item=SolvynkFixtures.problems.find(p=>p.slug===new URLSearchParams(location.search).get('slug'))||SolvynkFixtures.problems[0];document.title=item.title+' · BuildSocial';document.querySelector('#problem-detail').innerHTML=`<a class="back-link" href="explore.html#problems">← Back to open problems</a><section class="detail-hero"><p class="eyebrow">${item.label} · ${item.status}</p><h1>${item.title}</h1><div class="detail-meta"><span>${item.owner}</span><span>${item.location}</span><span>Problem / ${item.id}</span></div><div class="detail-actions"><button class="button button-primary" id="building">I’m building this ↗</button><a class="button button-outline" href="explore.html#projects">See projects</a></div><p id="building-message" class="form-message" role="status"></p></section><div class="detail-layout"><article><h2>The context</h2><p class="detail-copy">${item.summary} The best responses will be specific, honest about trade-offs, and useful to the people closest to the problem.</p><h2>What a useful solution covers</h2><ol class="requirements">${item.requirements.map((r,i)=>`<li><span class="req-number">0${i+1}</span><span>${r}</span></li>`).join('')}</ol><h2>Listed solutions</h2><a class="solution-card" href="project.html?slug=clearflow"><h3>ClearFlow</h3><p>One fixture project currently covers part of this problem.</p></a><div class="notice">Prototype disclaimer: this is fixture content. No submission, account, message, or personal data is collected.</div></article><aside class="detail-aside"><div class="aside-row"><span>Status</span><strong>${item.status}</strong></div><div class="aside-row"><span>Build window</span><strong>${item.window}</strong></div><div class="aside-row"><span>Requirements</span><strong>${item.requirements.length} numbered</strong></div><div class="aside-row"><span>Solutions</span><strong>${item.solutions} listed</strong></div></aside></div>`;document.querySelector('#building').addEventListener('click',()=>{document.querySelector('#building-message').textContent='Prototype only: your interest is recorded nowhere. A real product would ask you to sign in.';document.querySelector('#building-message').className='form-message success'});</script></body></html>
