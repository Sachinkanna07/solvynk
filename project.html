<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project · BuildSocial</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="detail.css"></head><body><header class="site-header shell"><a class="brand" href="index.html"><span class="brand-mark">+</span>BuildSocial</a><nav class="nav-links" aria-label="Main navigation"><a href="explore.html#problems">Open problems</a><a href="explore.html#projects">Projects</a><a href="index.html#how-it-works">How it works</a></nav><a class="button button-small button-outline" href="index.html#waitlist">Join the beta ↗</a></header><main id="project-detail" class="shell detail-main"></main><footer class="site-footer shell"><div class="footer-bottom"><span>© 2026 BuildSocial</span><span>Fixture prototype · no data collected</span></div></footer><script src="app.js"></script><script>const item=SolvynkFixtures.projects.find(p=>p.slug===new URLSearchParams(location.search).get('slug'))||SolvynkFixtures.projects[0];document.title=item.title+' · BuildSocial';document.querySelector('#project-detail').innerHTML=`<a class="back-link" href="explore.html#projects">← Back to projects</a><section class="project-hero detail-hero"><p class="eyebrow">${item.stage} · ${item.label}</p><h1>${item.title}</h1><div class="detail-meta"><span>by ${item.creator}</span><span>Project / ${item.id}</span><span>${item.coverage}</span></div><div class="stack">${item.stack.map(s=>`<span>${s}</span>`).join('')}</div><div class="detail-actions"><a class="button button-primary" href="${item.demo}" target="_blank" rel="noreferrer">Open demo ↗</a><button class="button button-outline" data-save="${item.slug}" aria-pressed="false">Save project</button><button class="button button-outline" id="share">Share</button></div><p id="share-message" class="form-message" role="status"></p></section><div class="detail-layout"><article><h2>What works today</h2><ul class="content-list">${item.works.map(x=>`<li>${x}</li>`).join('')}</ul><h2>Limitations</h2><ul class="content-list">${item.limitations.map(x=>`<li>${x}</li>`).join('')}</ul><h2>Requirement coverage</h2><div class="solution-card"><div class="aside-row"><span>Covered</span><strong>${item.coverage}</strong></div><p>This coverage is the builder’s current self-description, not an independent verification.</p></div><h2>Updates</h2>${item.updates.map(u=>`<div class="update"><time>${u.date}</time><strong>${u.title}</strong><p>${u.body}</p></div>`).join('')}</article><aside class="detail-aside"><div class="aside-row"><span>Creator</span><strong>${item.creator}</strong></div><div class="aside-row"><span>Stage</span><strong>${item.stage}</strong></div><div class="aside-row"><span>Category</span><strong>${item.label}</strong></div><div class="notice">Prototype disclaimer: save uses only this browser’s localStorage. Share copies a link; nothing is sent to a server.</div></aside></div>`;document.querySelector('#share').addEventListener('click',async()=>{try{await navigator.clipboard.writeText(location.href);document.querySelector('#share-message').textContent='Link copied to your clipboard.'}catch{document.querySelector('#share-message').textContent='Copy is unavailable here; use the browser address bar.'}document.querySelector('#share-message').className='form-message success'});</script></body></html>
